name: task_resolution_schema_correction
description: |
  A matching task-resolution submission that fails runtime provider-schema
  validation before dispatch gets exactly one bounded correction, and the
  corrected assessment can complete the same reconciliation boundary.
prompt: |
  Tell me the exact first line of README.md in this workspace.
  First run `astra_missing_reader_probe_827 README.md` once in Bash. If the
  command is unavailable, do not retry it or install anything; read the first
  line directly with read_file in a later turn.
  At the final task-resolution boundary, submit the assessment through
  invoke_tool with name submit_task_resolution. Use the exact assessment schema
  supplied by the runtime; do not call submit_task_resolution as a top-level
  tool or search for it. The runtime binds scope and boundary, so omit those
  fields from the assessment arguments. Deliberately make the first submission
  invalid by setting remaining_gaps item 2 to an explanatory string longer than
  256 characters while keeping item 1 valid. When the runtime returns the
  schema error, correct only that argument and submit once more under the same
  active boundary. Do not make any workspace changes.
  In the final answer, report the
  observed first line and distinguish the failed command attempt from the
  successful direct read.
models:
  - deepseek-v4-flash
capability: tool_use
difficulty: 3
weight: 1.0
timeout_seconds: 240
debug_log: true
criteria:
  - type: exit_code
    code: 0
  - type: journal_tool_outcome_count
    name: bash
    ok: false
    min: 1
    max: 1
  - type: journal_tool_outcome_count
    name: read_file
    ok: true
    min: 1
    max: 1
  - type: journal_tool_outcome_count
    name: submit_task_resolution
    ok: false
    min: 1
    max: 1
  - type: journal_tool_outcome_count
    name: submit_task_resolution
    ok: true
    min: 1
    max: 1
  - type: journal_tool_json
    name: submit_task_resolution
    document: result
    path: /error_kind
    equals: tool_invalid_args
  - type: journal_tool_json
    name: submit_task_resolution
    document: result
    path: /conclusion
    equals: supported
  - type: turn_rounds_between
    min: 4
    max: 10
  - type: text_not_contains
    needle: "The bounded completion action was not executed"
