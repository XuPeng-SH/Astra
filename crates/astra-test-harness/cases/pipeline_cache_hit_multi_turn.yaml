name: pipeline_cache_hit_multi_turn
description: |
  **What**: 4-turn session with identical-shape prompts to measure prompt-cache hits
  accumulated across turns. Turn 1 creates cache; turns 2–4 must hit it.
  **Tests**: Inclusive prompt-cache cost across turns, including auxiliary requests.
  This cost SLO is distinct from exact provider-final prefix continuity.
  **Why**: Cache hit ratio is the primary value prop of the context pipeline. A 0%
  hit ratio means stable content is being rebuilt every turn (HashMap drift, dynamic
  tool ordering, incompatible cache_control markers, etc.) and we're paying full
  input-token cost each turn instead of the 10% cached-read price.
  **Pass means** (calibrated against multiple runs of Bedrock Sonnet-4.6 + DeepSeek):
    - cumulative cached_input_tokens ≥ 10000 (Bedrock: 32k-52k; DeepSeek: 13k-25k — provider variance)
    - cache_creation_tokens ≤ 25000 (observed: 20k worst-case warm-up, 0 when
      cross-session cache is warm; 25k caps persistent ~5-6k/turn rebuilds)
    - token-weighted provider cache-read ratio after the first warm-up turn ≥ 98%
    - no tool calls; a tool-surface or ambient-context detour invalidates this measurement
  **Fail means**: the inclusive cache-cost SLO was not met. Inspect primary and
  auxiliary usage separately, provider-final system/tool identities, and conversation
  prefix continuity before assigning a cause. New input, cache block boundaries,
  auxiliary classification, and bounded repairs can lower this ratio without
  rewriting the primary prefix. Do not exclude auxiliary cost or pad the prompt
  to make the ratio pass; retain absolute fresh/input/output token measurements.
  **Catches**: cache-cost regressions that a cumulative cache-read minimum alone
  cannot detect. A pass does not by itself prove prefix continuity or tool behavior.
prompt: |
  Reply with the single word ACK. Do not call any tools.
capability: custom:cache
difficulty: 2
weight: 1.0
timeout_seconds: 180
steps:
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
  - prompt: 'Reply with the single word ACK. Do not call any tools.'
criteria:
  - type: exit_code
    code: 0
  # Wrap in all_of to promote `prompt_cache_tokens` from soft (default for
  # metric criteria) to a hard pass/fail — this case's whole purpose is to
  # catch cache-stability regressions in CI.
  - type: all_of
    criteria:
      - type: prompt_cache_tokens
        min_read: 10000
        min_creation: 0
        max_creation: 25000
      - type: provider_prompt_cache_read_ratio
        min: 0.98
        warmup_turns: 1
      - type: tools_count_between
        min: 0
        max: 0
