name: flash_model_name_is_output
description: |
  A quoted model name is the requested child output, not an execution selector.
  Verify default inheritance through actual child inference and parent adoption.
prompt: |
  请让一个子代理只返回字符串“glm-5.2”，等它完成后你也只返回这个字符串。
debug_log: true
capability: delegation
timeout_seconds: 120
criteria:
  - type: exit_code
    code: 0
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
    json_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: deepseek-v4-flash
  - type: session_event_count
    event_type: LlmRoundCompleted
    min: 1
    json_match:
      path: /payload/model
      equals: deepseek-v4-flash
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: session_child_result_adopted
    expected_result: glm-5.2
    spawn_match:
      path: /metadata/model_configuration/prepared_selection/model_name
      equals: deepseek-v4-flash
    allow_get_result: true
  - type: text_equals
    expected: glm-5.2
