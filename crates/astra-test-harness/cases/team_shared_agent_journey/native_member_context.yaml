name: native_team_member_context
description: |
  A native Team lead asks a configured member for one shared-context value.
  Launch, physical child execution, termination and adoption must be observed;
  a correct lead answer or successful process exit alone is insufficient.
team:
  name: harness-shared-agent
prompt: |
  Ask the reader member to read delivery_code from the team's shared context.
  Wait for its actual result and adopt that result. Ask the member to reply only
  with the value, and reply only with its returned value yourself. If the member
  cannot return it, explicitly report the failure rather than guessing.
debug_log: true
capability: delegation
timeout_seconds: 180
criteria:
  - type: exit_code
    code: 0
  - type: session_event_count
    event_type: agent_spawned
    min: 1
    max: 1
  - type: session_event_count
    event_type: LlmRoundCompleted
    min: 1
    json_match:
      path: /payload/model
      equals: glm-5.2
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: session_event_count
    event_type: agent_terminated
    min: 1
    max: 1
    json_match:
      path: /metadata/status
      equals: completed
      same_run_as:
        event_type: agent_spawned
        run_id_path: /metadata/run_id
  - type: session_child_result_adopted
    expected_result: BLUE-17
  - type: text_equals
    expected: BLUE-17
  - type: journal_tool_call_count
    name: bash
    root_only: true
    min: 0
    max: 0
